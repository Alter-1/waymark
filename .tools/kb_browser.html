<!doctype html>
<meta charset="utf-8">
<title>waymark KB browser</title>
<!--
  Every search here is the CLI's. The page asks /api/commands what exists and forwards queries to
  /api/q, which runs query_code_index.py --json. Nothing about the KB is implemented twice: the
  browser this replaces reimplemented searching in JavaScript over a 40 MB download, offered a
  fraction of the subcommands, and never learned about new ones.
-->
<style>
  :root { --bg:#12151a; --panel:#1a1f27; --line:#2b323d; --fg:#d7dee8; --dim:#8b96a5;
          --accent:#6ea8fe; --bad:#e06c75; --warn:#e5c07b; --ok:#98c379; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
           padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  select,input,button { background:#0e1116; color:var(--fg); border:1px solid var(--line);
                        border-radius:4px; padding:6px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.on { border-color:var(--accent); color:var(--accent); }
  #term { flex:1; min-width:220px; }
  main { display:flex; height:calc(100vh - 53px); }
  #out { flex:1; overflow:auto; padding:12px 14px; }
  #side { width:38%; min-width:320px; border-left:1px solid var(--line); overflow:auto;
          padding:12px 14px; background:#151920; display:none; }
  .row { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:8px;
         background:var(--panel); }
  .row h3 { margin:0 0 4px; font-size:14px; color:var(--accent); }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:2px 10px; }
  .kv div:nth-child(odd) { color:var(--dim); }
  pre { white-space:pre-wrap; word-break:break-word; margin:4px 0; }
  .note { color:var(--dim); padding:8px 0; }
  .bad { color:var(--bad); } .warn { color:var(--warn); } .ok { color:var(--ok); }
  canvas { display:block; background:#0e1116; }
  .fld { margin:10px 0; }
  .fld > .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .prose { white-space:pre-wrap; word-break:break-word; margin:2px 0 0; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .chip { background:#0e1116; border:1px solid var(--line); border-radius:10px;
          padding:1px 8px; font-size:12px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  a.ref { color:var(--accent); cursor:pointer; text-decoration:underline dotted; }
  details.tree { margin:2px 0 2px 10px; }
  details.tree > summary { cursor:pointer; color:var(--dim); }
  #legend { padding:6px 14px; color:var(--dim); border-top:1px solid var(--line); background:var(--panel); }
</style>

<header>
  <select id="cmd"></select>
  <input id="term" placeholder="search term" autofocus>
  <input id="limit" type="number" value="60" min="1" max="2000" style="width:80px" title="limit">
  <button id="full" title="full values, not the brief form">full</button>
  <button id="go">search</button>
  <button id="graphBtn" title="draw the KB's links">graph</button>
  <span id="stat" class="note"></span>
</header>
<main>
  <div id="out"><div class="note">Pick a search, or press <b>graph</b> to see how the entries link.</div></div>
  <div id="side"></div>
</main>
<div id="legend" style="display:none">
  drag a node to pin it &middot; click to open it &middot;
  <span class="ok">see_also</span> &middot; <span class="warn">relation</span> &middot;
  <span class="bad">broken / violated</span>
</div>

<script>
const $ = id => document.getElementById(id);
let FULL = false, NODES = [], EDGES = [], anim = null;

async function api(path) { const r = await fetch(path); return r.json(); }

// ONE PLACE UNWRAPS THE REPLY. Some searches answer with a bare list and some with
// {rows, limit, more_available} -- the CLI adds the envelope wherever a result can be truncated.
// search() handled both and openNode() did not, so EVERY click on the graph reported "referenced
// but has no entry of its own", which reads as a hole in the KB rather than a bug in the page.
function unwrap(d) {
  const r = d && d.rows;
  if (Array.isArray(r)) return r;
  if (r && Array.isArray(r.rows)) return r.rows;
  return [];
}

async function loadCommands() {
  const d = await api("/api/commands");
  $("cmd").innerHTML = (d.commands || []).map(c => `<option>${c}</option>`).join("");
  // The CLI is the authority on what can be asked; if it grows a search this picker grows with it.
  $("cmd").value = d.commands && d.commands.includes("annotation") ? "annotation" : ($("cmd").value);
  $("stat").textContent = (d.commands || []).length + " searches";
}

function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(rows) {
  const out = $("out");
  if (!rows.length) { out.innerHTML = '<div class="note">No matches.</div>'; return; }
  out.innerHTML = rows.map(r => {
    // A KB row IS an entry -- render it the way the panel does rather than as a key/value dump.
    if (r.value !== undefined) return entryHtml(r, r.name || "");
    const title = r.name || r.symbol || r.marker || r.source_name || r.entry || "";
    const body = Object.keys(r).filter(k => k !== "name" && r[k] !== "" && r[k] !== null)
      .map(k => `<div>${esc(k)}</div><div><pre>${esc(typeof r[k] === "object"
                 ? JSON.stringify(r[k], null, 1) : r[k])}</pre></div>`).join("");
    return `<div class="row"><h3>${esc(title)}</h3><div class="kv">${body}</div></div>`;
  }).join("");
}

async function search() {
  const cmd = $("cmd").value, term = $("term").value.trim();
  $("stat").textContent = "...";
  stopGraph();
  const q = new URLSearchParams({ cmd, term, limit: $("limit").value });
  if (FULL) q.set("full", "1");
  const d = await api("/api/q?" + q);
  if (d.text !== undefined) {
    $("out").innerHTML = `<div class="row"><pre>${esc(d.text)}</pre></div>`;
    $("stat").textContent = "rc=" + d.rc;
    return;
  }
  const rows = unwrap(d);
  render(rows);
  $("stat").textContent = rows.length + " rows";
}

/* ---- graph -------------------------------------------------------------------------------
   A small force layout rather than a library: this tool ships with no dependencies and has to
   work offline, and the whole layout is less code than vendoring one would be.                */
function stopGraph() {
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  $("legend").style.display = "none";
}

async function graph() {
  $("stat").textContent = "building...";
  const q = new URLSearchParams({ cmd: "graph", term: $("term").value.trim(), limit: 600 });
  const d = await api("/api/q?" + q);
  const data = (d.rows && d.rows.nodes) ? d.rows : { nodes: [], edges: [] };
  NODES = (data.nodes || []).map((n, i) => ({...n,
    x: 400 + 300 * Math.cos(i), y: 300 + 300 * Math.sin(i), vx: 0, vy: 0 }));
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  EDGES = (data.edges || []).filter(e => byId[e.from] && byId[e.to])
                            .map(e => ({...e, a: byId[e.from], b: byId[e.to] }));
  if (!NODES.length) { $("out").innerHTML = '<div class="note">Nothing to draw.</div>'; return; }

  $("out").innerHTML = '<canvas id="cv"></canvas>';
  $("legend").style.display = "";
  const cv = $("cv"), ctx = cv.getContext("2d");
  let drag = null, ox = 0, oy = 0, zoom = 1, alpha = 1, moved = false;
  function size() { cv.width = cv.clientWidth = $("out").clientWidth - 28;
                    cv.height = Math.max(400, $("out").clientHeight - 20); }
  size(); addEventListener("resize", () => { size(); reheat(); });

  /* IT HAS TO STOP MOVING. Applying the forces at full strength every frame means the graph never
     settles -- it drifts and wobbles indefinitely, which is unreadable and pins a core. Standard
     annealing: one global alpha scales every force and decays toward zero, and the loop HALTS when
     it is small enough. Any interaction reheats it, so it is live when you want it and still when
     you are reading it. */
  const ALPHA_DECAY = 0.022, ALPHA_MIN = 0.004, V_MAX = 12;
  function reheat(a) { const was = alpha; alpha = Math.max(alpha, a === undefined ? 0.55 : a);
                       if (was < ALPHA_MIN && !anim) anim = requestAnimationFrame(step); }

  const pt = e => ({ x: (e.offsetX - ox) / zoom, y: (e.offsetY - oy) / zoom });
  cv.onmousedown = e => { const p = pt(e); moved = false;
    const hit = NODES.find(n => Math.hypot(n.x - p.x, n.y - p.y) < 12);
    drag = hit || { pan: true, px: e.offsetX - ox, py: e.offsetY - oy };
    if (hit) { hit.fixed = true; reheat(0.35); } };
  cv.onmousemove = e => {
    if (!drag) return;
    moved = true;
    const p = pt(e);
    if (drag.pan) { ox = e.offsetX - drag.px; oy = e.offsetY - drag.py; draw(); }
    else { drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; reheat(0.35); } };
  cv.onmouseup = () => {
    // A DRAG IS NOT A CLICK. `moved` was read here before it was ever set, so every drag also
    // opened the entry -- the panel flickered open on each nudge.
    if (drag && !drag.pan && !moved) openNode(drag);
    else if (drag && drag.pan && !moved) closeSide();   // click on empty canvas dismisses it
    drag = null; };
  cv.onwheel = e => { e.preventDefault(); zoom *= e.deltaY < 0 ? 1.1 : 0.9; draw(); };

  function step() {
    const k = alpha;
    for (let i = 0; i < NODES.length; i++) {
      const n = NODES[i];
      for (let j = i + 1; j < NODES.length; j++) {     // each pair once, not twice
        const m = NODES[j];
        let dx = n.x - m.x, dy = n.y - m.y, d2 = dx*dx + dy*dy;
        if (d2 > 90000 || d2 === 0) continue;
        const f = 900 / d2 * k;
        n.vx += dx * f; n.vy += dy * f; m.vx -= dx * f; m.vy -= dy * f;
      }
      n.vx += (cv.width/2 - n.x) * 0.0009 * k;
      n.vy += (cv.height/2 - n.y) * 0.0009 * k;
    }
    for (const e of EDGES) {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.hypot(dx, dy) || 1;
      const f = (d - 120) * 0.010 * k;
      e.a.vx += dx/d*f; e.a.vy += dy/d*f; e.b.vx -= dx/d*f; e.b.vy -= dy/d*f;
    }
    for (const n of NODES) {
      if (n.fixed) { n.vx = n.vy = 0; continue; }
      n.vx *= 0.80; n.vy *= 0.80;
      // Clamp: one close pair can otherwise fling a node across the canvas in a single frame,
      // which then drags its neighbours after it and the whole sheet ripples.
      const v = Math.hypot(n.vx, n.vy);
      if (v > V_MAX) { n.vx = n.vx / v * V_MAX; n.vy = n.vy / v * V_MAX; }
      n.x += n.vx; n.y += n.vy;
    }
    alpha -= alpha * ALPHA_DECAY;
    draw();
    if (alpha > ALPHA_MIN) { anim = requestAnimationFrame(step); }
    else { anim = null; $("stat").textContent = NODES.length + " nodes, " + EDGES.length + " edges (settled)"; }
  }
  function edgeColour(e) {
    if (["missing", "ambiguous", "VIOLATED", "unchecked"].includes(e.status)) return "#e06c75";
    return e.type === "see_also" ? "#3f5570" : "#e5c07b";
  }
  function draw() {
    ctx.setTransform(zoom, 0, 0, zoom, ox, oy);
    ctx.clearRect(-ox/zoom, -oy/zoom, cv.width/zoom, cv.height/zoom);
    for (const e of EDGES) {
      ctx.strokeStyle = edgeColour(e);
      ctx.lineWidth = (e.status && e.status !== "ok") ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    }
    for (const n of NODES) {
      const open = (n.status || "") === "open";
      ctx.fillStyle = n.fixed ? "#6ea8fe" : (open ? "#e5c07b" : "#98c379");
      ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, 7); ctx.fill();
      if (zoom > 0.6) {
        ctx.fillStyle = "#8b96a5"; ctx.font = "11px monospace";
        ctx.fillText(n.id.length > 34 ? n.id.slice(0, 33) + "\u2026" : n.id, n.x + 9, n.y + 4);
      }
    }
  }

  step();
  $("stat").textContent = NODES.length + " nodes, " + EDGES.length + " edges";
}

/* ---- the entry, as something a person reads ------------------------------------------------
   The panel used to print JSON.stringify of the whole record. These entries are mostly one very
   long `notes` field, so that is a wall of escaped text with the useful parts -- what it is, what
   is still open, what it links to -- buried in it. Known fields get a shape; anything unexpected
   falls back to a collapsible tree rather than being dropped, because an entry is allowed to carry
   a field this page has never heard of.                                                        */
const FIELD_ORDER = ["brief", "notes", "status", "evidence", "min_fw", "kind", "concept_id",
                     "keywords", "files", "commits", "see_also", "relations"];

function linkify(text) {
  // [[name]] is how most references are written; make them behave like the links they are.
  return esc(text).replace(/\[\[([^\]]{2,120})\]\]/g,
    (_, t) => `<a class="ref" data-node="${esc(t.replace(/\s+/g, " "))}">${esc(t)}</a>`);
}

function chips(values, cmd) {
  return '<div class="chips">' + values.map(v =>
    `<span class="chip" data-cmd="${esc(cmd)}" data-term="${esc(v)}">${esc(v)}</span>`).join("") + "</div>";
}

function tree(value, depth) {
  if (value === null || value === undefined) return '<span class="note">null</span>';
  if (Array.isArray(value)) {
    if (!value.length) return '<span class="note">[]</span>';
    return `<details class="tree"${depth < 1 ? " open" : ""}><summary>${value.length} items</summary>` +
           value.map(v => `<div>${tree(v, depth + 1)}</div>`).join("") + "</details>";
  }
  if (typeof value === "object") {
    const keys = Object.keys(value);
    if (!keys.length) return '<span class="note">{}</span>';
    return `<details class="tree"${depth < 1 ? " open" : ""}><summary>${keys.length} fields</summary>` +
           keys.map(k => `<div class="fld"><span class="k">${esc(k)}</span>` +
                         `<div>${tree(value[k], depth + 1)}</div></div>`).join("") + "</details>";
  }
  return `<div class="prose">${linkify(String(value))}</div>`;
}

function entryHtml(rec, fallbackName) {
  let v = rec.value;
  if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { /* not JSON: show as prose */ } }
  const title = rec.name || rec.symbol || rec.marker || fallbackName;
  if (v === undefined || v === null || typeof v !== "object") {
    return `<div class="row"><h3>${esc(title)}</h3><div class="prose">${linkify(String(v ?? ""))}</div></div>`;
  }
  const seen = new Set(["name"]);
  let out = `<div class="row"><h3>${esc(title)}</h3>`;
  const put = (k, body) => { seen.add(k); out += `<div class="fld"><span class="k">${esc(k)}</span>${body}</div>`; };
  for (const k of FIELD_ORDER) {
    if (!(k in v) || v[k] === "" || v[k] === null) { seen.add(k); continue; }
    const val = v[k];
    if (k === "keywords") put(k, chips(val, "annotation"));
    else if (k === "files") put(k, chips(val, "file"));
    else if (k === "commits") put(k, chips(val, "commits"));
    else if (k === "see_also") put(k, '<div class="chips">' + (Array.isArray(val) ? val : [val]).map(t => {
      const name = String(typeof t === "object" ? (t.target || t.name || "") : t).replace(/^\w+:/, "");
      return `<span class="chip" data-node="${esc(name)}">${esc(name)}</span>`; }).join("") + "</div>");
    else if (typeof val === "object") put(k, tree(val, 0));
    else put(k, `<div class="prose">${linkify(String(val))}</div>`);
  }
  const rest = Object.keys(v).filter(k => !seen.has(k));
  if (rest.length) {
    out += `<div class="fld"><span class="k">other</span>${tree(
      Object.fromEntries(rest.map(k => [k, v[k]])), 0)}</div>`;
  }
  return out + "</div>";
}

function closeSide() { $("side").style.display = "none"; }

async function openNode(n) {
  const side = $("side");
  side.style.display = "block";
  side.innerHTML = '<div class="note">loading ' + esc(n.id) + '...</div>';
  // A NODE IS NOT ALWAYS AN ENTRY. Many are link TARGETS -- a symbol, an API marker, a route, a
  // file -- and asking `annotation` about those correctly finds nothing, which made the panel say
  // "referenced but has no entry" for every one of them. Try the lookups the CLI already has.
  let rows = [], via = "";
  for (const cmd of ["annotation", "concept", "symbol", "constant", "api", "route", "file"]) {
    const d = await api("/api/q?" + new URLSearchParams({cmd, term: n.id, full: "1", limit: 3}));
    rows = unwrap(d).filter(r =>
      cmd === "annotation" || [r.name, r.symbol, r.marker, r.file].includes(n.id));
    if (rows.length) { via = cmd; break; }
  }
  // THERE MUST BE A WAY OUT. The panel opened on a click and nothing closed it: no control, no
  // key, no click-away. Three, because each is the one somebody reaches for first.
  const shut = '<button id="shut" title="close (Esc)" style="float:right">close</button>';
  side.innerHTML = shut + (rows.length
    ? `<div class="note">found via <b>${esc(via)}</b></div>` +
      rows.map(r => entryHtml(r, n.id)).join("")
    : `<div class="note">${esc(n.id)} is referenced but has no entry of its own.</div>`);
  $("shut").onclick = closeSide;
}

// DELEGATED, not per-element: the panel and the results list are rebuilt on every query, and
// re-binding each chip after each render is how half of them end up dead.
addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-node],[data-cmd]");
  if (!el) return;
  if (el.dataset.node) { openNode({ id: el.dataset.node }); return; }
  $("cmd").value = el.dataset.cmd;
  $("term").value = el.dataset.term || "";
  search();
});
addEventListener("keydown", e => { if (e.key === "Escape") closeSide(); });
$("go").onclick = search;
$("graphBtn").onclick = graph;
$("term").onkeydown = e => { if (e.key === "Enter") search(); };
$("full").onclick = () => { FULL = !FULL; $("full").classList.toggle("on", FULL); };
loadCommands();

// A SEAM SO THIS PAGE CAN BE CHECKED WITHOUT A HUMAN. Opening it with #selftest draws the graph,
// opens the first node, and records what happened in a div -- which a headless engine can read.
// Every bug in this page so far (a drag counted as a click, a panel with no way out, every click
// reporting "no entry" because one of two reply shapes was unhandled) was invisible to a syntax
// check and obvious the moment something actually clicked.
async function selftest() {
  const log = [];
  try {
    await graph();
    log.push("nodes=" + NODES.length, "edges=" + EDGES.length);
    // #selftest=<name> targets one entry: the first node is whatever sorts first, which is often a
    // bare link target with no keywords or references, so "0 chips" says nothing either way.
    const want = decodeURIComponent((location.hash.split("=")[1] || ""));
    const pick = want ? (NODES.find(n => n.id === want) || { id: want }) : NODES[0];
    if (NODES.length) {
      await openNode(pick);
      const side = $("side");
      log.push("panel=" + (side.style.display === "block" ? "open" : "closed"));
      log.push("panelHasEntry=" + (side.textContent.includes("has no entry") ? "no" : "yes"));
      log.push("closeButton=" + ($("shut") ? "yes" : "no"));
      closeSide();
      log.push("afterClose=" + (side.style.display === "none" ? "closed" : "STILL OPEN"));
    }
  } catch (e) { log.push("ERROR=" + e.message); }
  const d = document.createElement("div");
  d.id = "__selftest"; d.setAttribute("data-result", log.join(" "));
  document.body.appendChild(d);
}
if (location.hash.startsWith("#selftest")) { addEventListener("load", () => setTimeout(selftest, 400)); }
</script>
